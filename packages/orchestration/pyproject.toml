[project]
name = "olist-orchestration"
version = "0.1.0"
description = "Prefect flows orchestrating the Olist ELT pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "global-config",
    "prefect>=3.1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestration"]
