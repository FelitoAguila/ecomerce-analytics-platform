[project]
name = "olist-dashboard"
version = "0.1.0"
description = "Streamlit dashboard over the Olist gold layer"
requires-python = ">=3.12"
dependencies = [
    "global-config",
    "google-cloud-bigquery>=3.25.0",
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "streamlit>=1.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]
