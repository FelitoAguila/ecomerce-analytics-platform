[project]
name = "olist-ecommerce-database"
version = "0.1.0"
description = "Use olist-dataset to simulate a live postgres db"
readme = "README.md"
authors = [
    { name = "Felix Manuel Aguila Alonso", email = "feloaguila@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
    "global-config",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.5",
]

[project.scripts]
seed = "ecommerce_db.seed:main"
simulate = "ecommerce_db.simulator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_db"]

