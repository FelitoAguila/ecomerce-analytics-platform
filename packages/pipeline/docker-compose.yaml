services:
  elt:
    build:
      context: ../..
      dockerfile: packages/pipeline/Dockerfile
    environment:
      POSTGRES_DB__DSN: ${POSTGRES_DB__DSN:?POSTGRES_DB__DSN is required}
      BIGQUERY__PROJECT: ${BIGQUERY__PROJECT:?BIGQUERY__PROJECT is required}
      BIGQUERY__LOCATION: ${BIGQUERY__LOCATION:-us-central1}
      BIGQUERY__KEYFILE: /app/secrets/gcp-sa.json
    volumes:
      # Read-only .env so `uv run --env-file /app/.env dbt` works; the
      # environment block above still wins (OS env > dotenv).
      - ../../.env:/app/.env:ro
      # Service account key, mounted read-only; path matches BIGQUERY__KEYFILE.
      - ${BIGQUERY__KEYFILE:?BIGQUERY__KEYFILE is required}:/app/secrets/gcp-sa.json:ro
