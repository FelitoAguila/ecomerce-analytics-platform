[project]
name = "olist-pipeline"
version = "0.1.0"
description = "ELT pipeline: dlt (Postgres -> BigQuery bronze) + dbt (silver/gold)"
requires-python = ">=3.12"
dependencies = [
    "dlt[bigquery,sql-database]>=1.30.0",
    "global-config",
    "psycopg[binary]>=3.3.4",
]

[project.scripts]
ingest = "pipeline.ingestion:main"
elt = "pipeline.run_elt:main"

[dependency-groups]
dbt-bigquery = [
    "dbt-bigquery>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
