olist_ecommerce:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('BIGQUERY__PROJECT') }}"
      dataset: bronze_data
      keyfile: "{{ env_var('BIGQUERY__KEYFILE') }}"
      location: "{{ env_var('BIGQUERY__LOCATION', 'us-central1') }}"
      threads: 4
