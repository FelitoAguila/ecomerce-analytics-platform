services:
  oltp:
    image: postgres:16-alpine
    container_name: ecommerce_oltp
    env_file: .env
    ports:
      - "${OLTP_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  seed:
    build: .
    container_name: ecommerce_seed
    command: uv run python src/oltp/seed.py
    environment:
      OLTP_HOST: oltp
      OLTP_PORT: "5432"
      PYTHONUNBUFFERED: "1"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      oltp:
        condition: service_healthy

  simulator:
    build: .
    container_name: ecommerce_simulator
    command: uv run python src/oltp/simulator.py --continuous --orders 50 --interval 30
    environment:
      OLTP_HOST: oltp
      OLTP_PORT: "5432"
      PYTHONUNBUFFERED: "1"
    env_file: .env
    volumes:
      - ./src:/app/src
    depends_on:
      oltp:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
