version: 2

sources:
  - name: ecommerce_data
    schema: ecommerce_data
    loader: dlt

    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 72, period: hour}
    loaded_at_field: updated_at

    tables:
      - name: orders
      - name: customers
      - name: sellers
      - name: products
      - name: geolocation
      - name: order_items
      - name: order_payments
      - name: reviews
      - name: product_category_name_translation