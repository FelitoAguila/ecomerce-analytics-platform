version: 2

snapshots:
  - name: orders_snapshot
    description: "SCD Type 2 snapshot of orders tracking the full history of status changes over time."
    columns:
      - name: order_id
        description: "Unique identifier of the order being tracked."
        data_tests:
          - not_null
      - name: order_status
        description: "Status of the order at this point in the snapshot history."
        data_tests:
          - not_null
      - name: dbt_valid_from
        description: "Timestamp when this version of the order became valid."
        data_tests:
          - not_null
      - name: dbt_valid_to
        description: "Timestamp when this version of the order stopped being valid. Null when it is the current version."