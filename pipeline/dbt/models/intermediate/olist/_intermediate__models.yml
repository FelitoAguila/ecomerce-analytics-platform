version: 2

models:
  - name: int_orders_enriched
    description: "Enriched orders with customer attributes, plus derived delivery and approval timing metrics."
    columns:
      - name: order_id
        description: "Foreign key. Unique identifier for an order record."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key. Unique identifier for the order-level customer record."
        data_tests:
          - not_null
      - name: customer_unique_id
        description: "Stable identifier for the real customer that placed the order."
        data_tests:
          - not_null
      - name: order_status
        description: "Status of the order."
        data_tests:
          - accepted_values:
              values: ['created', 'approved', 'invoiced', 'processing', 'shipped', 'delivered', 'canceled', 'unavailable']
      - name: delivery_days
        description: "Number of days between purchase and customer delivery. Null for orders not yet delivered."

  - name: int_order_items_enriched
    description: "Enriched order items joined to products, sellers, and the English category translation."
    columns:
      - name: order_id
        description: "Foreign key. Unique identifier for the order that contains the item."
        data_tests:
          - not_null
      - name: order_item_id
        description: "Sequence number of the item within its order."
        data_tests:
          - not_null
      - name: product_id
        description: "Foreign key. Unique identifier for the product being ordered."
        data_tests:
          - not_null
      - name: price
        description: "Price of the product in the order item."
        data_tests:
          - not_null
      - name: freight_value
        description: "Freight cost for the order item."
        data_tests:
          - assert_non_negative

  - name: int_order_items_aggregated
    description: "Order-level rollup of items: item count and monetary totals, one row per order."
    columns:
      - name: order_id
        description: "Foreign key. Unique identifier for an order record."
        data_tests:
          - unique
          - not_null
      - name: item_count
        description: "Number of items in the order."
        data_tests:
          - not_null
          - assert_non_negative
      - name: order_total_value
        description: "Sum of item price and freight across the order."
        data_tests:
          - not_null
          - assert_non_negative

  - name: int_geolocation_aggregated
    description: "Geolocation rolled up to city and state with average coordinates and a location count."
    columns:
      - name: geolocation_city
        description: "City from the geolocation data."
        data_tests:
          - not_null
      - name: geolocation_state
        description: "State (UF code) from the geolocation data."
        data_tests:
          - not_null
      - name: location_count
        description: "Number of raw geolocation rows contributing to this city/state."
        data_tests:
          - not_null
          - assert_non_negative