[project]
name = "olist-ecommerce"
version = "0.1.0"
description = "Data engineering portfolio project: simulated Olist e-commerce + analytics platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "olist-ecommerce-database",
    "olist-pipeline",
    "olist-dashboard",
    "olist-orchestration",
    "global-config",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
olist-ecommerce-database = { workspace = true }
olist-pipeline = { workspace = true }
olist-dashboard = { workspace = true }
olist-orchestration = { workspace = true }
global-config = { workspace = true }

[tool.ruff]
src = ["packages/*/src"]

[tool.ruff.lint.isort]
known-first-party = ["config", "ecommerce_db", "pipeline", "dashboard", "orchestration"]

[tool.pytest.ini_options]
testpaths = ["packages/*/tests", "tests"]
addopts = "-ra"
markers = [
    "unit: fast unit tests with no external services",
    "integration: integration tests requiring external credentials/services",
    "slow: slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

