version: 2

models:
  - name: dim_customers
    description: "Dimension of real customers, one row per unique customer (customer_unique_id)."
    columns:
      - name: customer_unique_id
        description: "Primary key. Stable identifier for a real customer."
        data_tests:
          - unique
          - not_null
      - name: customer_state
        description: "State (UF code) associated with the customer."

  - name: dim_products
    description: "Dimension of products, one row per product."
    columns:
      - name: product_id
        description: "Primary key. Unique identifier for a product."
        data_tests:
          - unique
          - not_null
      - name: product_category_name
        description: "Portuguese product category name."

  - name: dim_sellers
    description: "Dimension of sellers, one row per seller."
    columns:
      - name: seller_id
        description: "Primary key. Unique identifier for a seller."
        data_tests:
          - unique
          - not_null
      - name: seller_state
        description: "State (UF code) where the seller is located."

  - name: fct_orders
    description: "Fact table of orders, one row per order, with item and monetary totals."
    columns:
      - name: order_id
        description: "Primary key. Unique identifier for an order."
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Foreign key to dim_customers. Stable identifier for the customer that placed the order."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id
      - name: order_status
        description: "Status of the order."
        data_tests:
          - accepted_values:
              values: ['created', 'approved', 'invoiced', 'processing', 'shipped', 'delivered', 'canceled', 'unavailable']
      - name: item_count
        description: "Number of items in the order."
        data_tests:
          - not_null
          - assert_non_negative
      - name: order_total_value
        description: "Total monetary value of the order (price plus freight)."
        data_tests:
          - not_null
          - assert_non_negative
      - name: total_freight
        description: "Total freight cost for the order."
        data_tests:
          - assert_non_negative

  - name: fct_order_payments
    description: "Fact table of order payments, one row per payment line within an order."
    columns:
      - name: order_id
        description: "Foreign key to fct_orders. Unique identifier for the order being paid."
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: payment_type
        description: "Type of payment used for the order."
        data_tests:
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_value
        description: "Value of the payment made for the order."
        data_tests:
          - not_null
          - assert_non_negative